# Canonical production entry: https://botcode.work
#
# Before enabling the TLS blocks:
# 1. Point botcode.work to 39.105.91.81 and www.botcode.work to botcode.work.
# 2. Create /var/www/certbot and expose the ACME location below.
# 3. From an external network, confirm the ACME path is not intercepted by an
#    ICP-filing 403 page, then issue both names with Certbot webroot.
# 4. Confirm the certificate paths exist, then run nginx -t before reloading.

map $http_upgrade $oj_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream oj_next_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Keep port 80 available for ACME HTTP-01 renewal. All other domain traffic is
# redirected to the single canonical HTTPS origin while preserving the URI.
server {
    listen 80;
    server_name botcode.work www.botcode.work;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://botcode.work$request_uri;
    }
}

# Plain-HTTP IP visits are also canonicalized. HTTPS-by-IP is intentionally not
# supported because the certificate is issued to the domain names.
server {
    listen 80;
    server_name 39.105.91.81;

    return 301 https://botcode.work$request_uri;
}

# www is accepted only as a compatibility entry and always redirects to apex.
server {
    listen 443 ssl http2;
    server_name www.botcode.work;

    ssl_certificate /etc/letsencrypt/live/botcode.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botcode.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OJ_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Start with one day. Raise to 15552000 only after seven stable days and a
    # successful certbot renew --dry-run. Do not add includeSubDomains/preload.
    add_header Strict-Transport-Security "max-age=86400" always;

    return 301 https://botcode.work$request_uri;
}

server {
    listen 443 ssl http2;
    server_name botcode.work;

    ssl_certificate /etc/letsencrypt/live/botcode.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botcode.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OJ_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;

    # Multi-document Markdown imports allow up to 8 MiB of source content;
    # keep room for parsed preview JSON and the request envelope.
    client_max_body_size 25m;

    # AI calls can legitimately run for up to four minutes upstream. Keep a
    # bounded proxy allowance and disable buffering for SSE responses.
    location ~ ^/api/(?:ai/problem-assist|admin/problems/[0-9]+/(?:programming-assist|objective-explanation)|problems/[0-9]+/objective-explanation|admin/learning/insight)/?$ {
        proxy_pass http://oj_next_app;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://oj_next_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oj_connection_upgrade;
    }
}
