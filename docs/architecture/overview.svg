<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">C++ 在线 OJ 系统整体架构</title>
  <desc id="desc">浏览器经 HTTPS 和 Nginx 访问 Next.js 应用。服务端完成鉴权、题目、考试、反馈和 AI 业务；编程提交经进程内队列进入 Docker Judge，客观题在服务端判分；Prisma 将业务记录存入 SQLite，生产数据库定期备份。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d7dedc" stroke-width="1" opacity=".35"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#516e80"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#bb683d"/></marker>
    <style>
      text{font-family:Inter,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18313b}
      .kicker{font-size:18;font-weight:700;letter-spacing:3px;fill:#a45d3d}.title{font-size:40;font-weight:800}.subtitle{font-size:18;fill:#5d727b}.zone{fill:#fffdf8;stroke:#ccd8d7;stroke-width:2}.head{font-size:22;font-weight:750}.label{font-size:18;font-weight:650}.small{font-size:15;fill:#61737b}.tiny{font-size:14;fill:#60747c}.pill{font-size:14;font-weight:700}.line{fill:none;stroke:#516e80;stroke-width:3;marker-end:url(#arrow)}.orange{stroke:#bb683d;marker-end:url(#arrowOrange)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#f4f6f3"/><rect width="1600" height="960" fill="url(#grid)"/>
  <text x="48" y="56" class="kicker">BOTCODE / SYSTEM MAP</text>
  <text x="48" y="105" class="title">C++ 在线 OJ · 系统整体架构</text>
  <text x="48" y="137" class="subtitle">当前单实例部署 · HTTPS 入口 · Next.js 业务服务 · SQLite 持久化 · Docker 隔离评测</text>

  <!-- Cross-zone traffic is drawn below the cards. -->
  <path d="M338 362 H386" class="line"/>
  <path d="M576 362 H620" class="line"/>
  <path d="M1048 362 H1106" class="line"/>
  <path d="M737 706 V772" class="line orange"/>
  <path d="M925 706 V772" class="line"/>
  <path d="M1328 674 V773" class="line"/>
  <path d="M628 194 C535 172 450 166 338 194" fill="none" stroke="#bb683d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowOrange)"/>
  <text x="404" y="180" class="tiny" fill="#a45d3d">页面 / JSON / 安全 SSE 返回</text>

  <rect x="42" y="170" width="296" height="590" rx="22" class="zone"/>
  <rect x="42" y="170" width="296" height="74" rx="22" fill="#dce9e6"/><rect x="42" y="216" width="296" height="28" fill="#dce9e6"/>
  <text x="66" y="215" class="head">01  浏览器端</text>
  <text x="66" y="281" class="label">学生</text><text x="66" y="307" class="small">做题、考试、AI 辅导、反馈</text>
  <path d="M66 325 H314" stroke="#e2e7e4"/>
  <text x="66" y="365" class="label">老师</text><text x="66" y="391" class="small">组卷、学情、专项任务</text>
  <path d="M66 410 H314" stroke="#e2e7e4"/>
  <text x="66" y="449" class="label">管理员</text><text x="66" y="475" class="small">题库、账号、策略、全部反馈</text>
  <rect x="65" y="526" width="250" height="103" rx="14" fill="#f1f6f5" stroke="#d5e1de"/>
  <text x="81" y="555" class="label">本地临时数据</text>
  <text x="81" y="583" class="small">编辑器草稿在浏览器保存</text>
  <text x="81" y="608" class="tiny">不是正式提交记录</text>
  <text x="66" y="690" class="tiny">按角色展示；敏感数据由服务端控制</text>

  <rect x="386" y="264" width="190" height="196" rx="22" class="zone"/>
  <rect x="402" y="282" width="158" height="40" rx="12" fill="#dce9e6"/>
  <text x="416" y="309" class="label">02  HTTPS</text>
  <text x="410" y="361" class="head">Nginx</text>
  <text x="410" y="394" class="small">域名与 TLS 入口</text>
  <text x="410" y="420" class="small">反向代理 / 静态资源</text>
  <text x="410" y="446" class="tiny">生产：botcode.work</text>

  <rect x="620" y="170" width="428" height="536" rx="22" class="zone"/>
  <rect x="620" y="170" width="428" height="76" rx="22" fill="#dce7f0"/><rect x="620" y="220" width="428" height="26" fill="#dce7f0"/>
  <text x="645" y="214" class="head">03  Next.js · PM2 单实例</text>
  <text x="645" y="283" class="label">App Router 页面与 API</text>
  <text x="645" y="310" class="small">会话鉴权 · 角色 / 归属校验 · 请求限额</text>
  <rect x="644" y="335" width="380" height="68" rx="12" fill="#edf4f8"/>
  <text x="662" y="363" class="label">题库 / 正式考试 / 提交</text>
  <text x="662" y="388" class="small">题面读取、提交校验、成绩更新</text>
  <rect x="644" y="416" width="380" height="68" rx="12" fill="#edf4f8"/>
  <text x="662" y="444" class="label">学情 / 专项任务 / 排行</text>
  <text x="662" y="469" class="small">提交统计 + 抽奖 / 翻倍奖励，更新进度</text>
  <rect x="644" y="497" width="380" height="68" rx="12" fill="#edf4f8"/>
  <text x="662" y="525" class="label">问题反馈 / 私有截图</text>
  <text x="662" y="550" class="small">管理员处理；附件每次读取鉴权</text>
  <rect x="644" y="578" width="380" height="92" rx="12" fill="#fcf0e8"/>
  <text x="662" y="607" class="label">AI 服务端代理</text>
  <text x="662" y="635" class="small">上游完整回复 → 安全检查 → SSE 分片</text>
  <text x="662" y="660" class="tiny">不把原始 token 或密钥直送浏览器</text>

  <rect x="1106" y="170" width="452" height="504" rx="22" class="zone"/>
  <rect x="1106" y="170" width="452" height="76" rx="22" fill="#e8e4d7"/><rect x="1106" y="220" width="452" height="26" fill="#e8e4d7"/>
  <text x="1131" y="214" class="head">04  数据层 · Prisma → SQLite</text>
  <text x="1130" y="282" class="label">生产数据库</text>
  <text x="1130" y="308" class="small">/www/oj/prisma/prod.db</text>
  <path d="M1130 330 H1534" stroke="#dddcd2"/>
  <text x="1130" y="365" class="label">账号与配置</text>
  <text x="1130" y="390" class="small">User · StudentProfile · SystemSetting</text>
  <text x="1130" y="431" class="label">题目与答题事实</text>
  <text x="1130" y="456" class="small">Problem · TestCase · Submission</text>
  <text x="1130" y="481" class="small">SubmissionCaseResult</text>
  <text x="1130" y="522" class="label">教学过程</text>
  <text x="1130" y="547" class="small">Exam · LearningAssignment · PointReward</text>
  <text x="1130" y="588" class="label">辅导与反馈</text>
  <text x="1130" y="613" class="small">AiConversation · Feedback / 图片 BLOB</text>
  <text x="1130" y="647" class="tiny">隐藏测试、答案和提交代码均留在服务端</text>

  <rect x="620" y="772" width="258" height="145" rx="20" class="zone"/>
  <rect x="639" y="789" width="220" height="34" rx="11" fill="#f6dfd1"/>
  <text x="652" y="813" class="pill">编程题分支</text>
  <text x="642" y="854" class="label">进程内队列 → Docker</text>
  <text x="642" y="882" class="small">C++17 编译、运行与隔离</text>
  <text x="642" y="904" class="tiny">客观题在服务端直接判分</text>

  <rect x="897" y="772" width="257" height="145" rx="20" class="zone"/>
  <rect x="916" y="789" width="218" height="34" rx="11" fill="#dce7f0"/>
  <text x="929" y="813" class="pill">独立外部依赖</text>
  <text x="919" y="854" class="label">AI 上游服务</text>
  <text x="919" y="882" class="small">仅由服务端调用</text>
  <text x="919" y="904" class="tiny">配置和密钥不进入浏览器</text>

  <rect x="1210" y="773" width="348" height="144" rx="20" class="zone"/>
  <rect x="1229" y="790" width="310" height="34" rx="11" fill="#e8e4d7"/>
  <text x="1242" y="814" class="pill">运维备份</text>
  <text x="1232" y="855" class="label">/www/backups</text>
  <text x="1232" y="883" class="small">定时与发布前备份 prod.db</text>
  <text x="1232" y="905" class="tiny">备份不进入 Git 仓库</text>
</svg>
